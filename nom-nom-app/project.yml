name: NomNom
options:
  bundleIdPrefix: com.figueroa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.0.0"

targets:
  NomNom:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NomNom
    configFiles:
      Debug: NomNom/Resources/Secrets.xcconfig
      Release: NomNom/Resources/Secrets.xcconfig
    settings:
      base:
        INFOPLIST_FILE: NomNom/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.figueroa.nomnom
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: Supabase
        product: Supabase
      - package: MarkdownUI
        product: MarkdownUI
